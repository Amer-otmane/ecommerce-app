@if (product) {
  <div style="border:1px solid #e2e8f0; border-radius:16px;
    padding:16px; background:white;">

    <!-- ✅ ng-content avec select — projection de contenu -->
    <ng-content select="[slot-badge]"></ng-content>

    <img [src]="product.thumbnail"
         style="width:100%; height:180px; object-fit:contain;">

    <h3 style="font-size:15px; margin:10px 0 5px;">
      {{ product.title | titlecase }}
    </h3>

    <span style="font-size:11px; color:#2563eb;">
      {{ product.category | uppercase }}
    </span>

    <div style="font-size:20px; font-weight:bold; color:#16a34a; margin:8px 0;">
      {{ product.price | currency:'USD' }}
    </div>

    <div style="font-size:12px; margin-bottom:12px;"
         [ngStyle]="{ color: product.stock > 5 ? '#16a34a' : '#dc2626' }">
      {{ product.stock | number }} en stock
    </div>

    <button [routerLink]="['/product', product.id]" style="
      background:white; color:#2563eb; border:1px solid #2563eb;
      padding:10px; border-radius:10px;
      font-size:14px; font-weight:bold;
      cursor:pointer; width:100%; margin-bottom:8px;">
      👁️ Voir détails
    </button>

    <button (click)="onAddToCart()" style="
      background:#2563eb; color:white; border:none;
      padding:10px; border-radius:10px;
      font-size:14px; font-weight:bold;
      cursor:pointer; width:100%;">
      🛒 Ajouter
    </button>

  </div>
}
